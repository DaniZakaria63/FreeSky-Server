name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p freesky-server -p freesky-admin-tui

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Stage binaries and helper scripts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # freesky-server is required by the helper; the rest are installed
          # when present, which is how admin-tui reaches the VPS.
          scp -P "$VPS_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 \
            target/release/freesky-server \
            target/release/admin-tui \
            scripts/freesky-admin.sh \
            scripts/freesky-deploy.sh \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/sbin/freesky-deploy"
