[package]
name = "freesky-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# HTTP + async
axum = "0.8"
tokio = { version = "1", features = ["full", "net"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MLS group encryption
openmls = "0.7"

# Transport security (Noise IK)
snow = "0.10"
blake2 = "0.10"

# Crypto primitives
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.8"

# Encoding
hex = "0.4"
base64 = "0.22"

# Error handling
anyhow = "1"
thiserror = "2"

# Time
chrono = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.freesky-shared]
path = "../shared"
